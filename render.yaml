services:
  - type: web
    runtime: node
    name: observa-vacacai-api
    rootDir: backend
    plan: free
    autoDeployTrigger: commit
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "18.16.0"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: AUTH_TOKEN_SECRET
        sync: false
      - key: AUTH_TOKEN_TTL_HOURS
        value: "12"
      - key: WEATHER_API_URL
        value: "https://api.open-meteo.com/v1/forecast"
      - key: WEATHER_LATITUDE
        value: "-30.33639"
      - key: WEATHER_LONGITUDE
        value: "-54.32"
      - key: WEATHER_LOCATION_LABEL
        value: "São Gabriel/RS"
      - key: WEATHER_TIMEZONE
        value: "America/Sao_Paulo"
      - key: WEATHER_CACHE_MINUTES
        value: "15"

  - type: web
    runtime: static
    name: observa-vacacai-web
    rootDir: frontend
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "18.16.0"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
